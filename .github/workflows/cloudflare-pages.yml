name: Vision · verificar e publicar

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Sintaxe e referências locais
        run: |
          node --check script.js
          node --check trailer.js
          node --check scripts/prepare-deploy.mjs
          node scripts/check.mjs .
          node scripts/prepare-deploy.test.mjs
      - name: Conferir pacote público
        run: |
          node scripts/prepare-deploy.mjs
          node scripts/check.mjs dist

  publish:
    name: Publicar no Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validar autorização configurada
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo '::error::Configure os dois segredos do Cloudflare antes de ativar a publicação.'
            exit 1
          fi
      - name: Preparar somente arquivos públicos
        run: node scripts/prepare-deploy.mjs
      - name: Publicar no projeto existente
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=vision --branch=main
